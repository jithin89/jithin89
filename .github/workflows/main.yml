name: Install OpenTofu and Terraform

on:
  push:
    branches: [main]

jobs:
  setup-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Verify Terraform installation
        run: terraform -version

      - name: Install OpenTofu
        run: |
          curl -s https://get.opentofu.org/install.sh | bash
          echo "$HOME/.opentofu/bin" >> $GITHUB_PATH
          echo "export PATH=$HOME/.opentofu/bin:\$PATH" >> $GITHUB_ENV

      - name: Verify OpenTofu installation
        run: |
          export PATH=$HOME/.opentofu/bin:$PATH
          tofu version
