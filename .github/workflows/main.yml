name: Install OpenTofu and Terraform

on:
  push:
    branches: [main]

jobs:
  setup-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Verify Terraform installation
        run: terraform -version

      - name: Install OpenTofu manually
        run: |
          TOFU_VERSION="1.6.2"  # change to latest if needed
          curl -LO https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip
          unzip tofu_${TOFU_VERSION}_linux_amd64.zip
          sudo mv tofu /usr/local/bin/
          tofu version
